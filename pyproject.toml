[project]
name = "support-agent-rag"
version = "0.1.0"
description = "A support assistant grounded in retrieved knowledge base content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["support-agent-tz.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
